name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-24.04
    needs: build-linux
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Add Android Rust target
        run: rustup target add aarch64-linux-android

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Set Android NDK path
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install npm dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Set app version from tag
        env:
          VERSION: ${{ needs.build-linux.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            cfg.version = process.env.VERSION;
            fs.writeFileSync("src-tauri/tauri.conf.json", JSON.stringify(cfg, null, 2) + "\n");
          '
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Initialize Android project
        run: npm run tauri android init -- --ci

      - name: Apply Android launcher icons
        run: cp -r src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          KEYSTORE_PATH="$RUNNER_TEMP/release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

          python3 - <<'PY'
          import re

          path = "src-tauri/gen/android/app/build.gradle.kts"
          content = open(path).read()
          if "import java.util.Properties" not in content:
              content = "import java.util.Properties\n" + content

          signing_block = '''
              signingConfigs {
                  create("release") {
                      val propertiesFile = rootProject.file("keystore.properties")
                      val properties = Properties()
                      properties.load(propertiesFile.inputStream())
                      storeFile = file(properties["storeFile"] as String)
                      storePassword = properties["storePassword"] as String
                      keyAlias = properties["keyAlias"] as String
                      keyPassword = properties["keyPassword"] as String
                      storeType = "PKCS12"
                  }
              }
          '''

          if "signingConfigs {" not in content:
              assert "    buildTypes {" in content, "buildTypes block not found in generated Gradle file"
              content = content.replace("    buildTypes {", signing_block + "    buildTypes {", 1)

          release_pattern = r'(getByName\("release"\)\s*\{\s*)'
          content, count = re.subn(
              release_pattern,
              lambda match: match.group(1) + '            signingConfig = signingConfigs.getByName("release")\n',
              content,
              count=1,
          )
          assert count == 1, "release buildType not found in generated Gradle file"
          open(path, "w").write(content)
          PY

      - name: Build signed Android APK and AAB
        run: npm run tauri android build -- --target aarch64 --apk --aab

      - name: Upload Android packages to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: write-nostr-android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

      - name: Attach APK to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)
          AAB=$(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' -print -quit)
          test -n "$APK"
          test -n "$AAB"
          gh release upload "$GITHUB_REF_NAME" \
            "$APK#write-nostr-android-arm64.apk" \
            "$AAB#write-nostr-android.aab" \
            --clobber

      - name: Set up Go for Zapstore CLI
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install Zapstore CLI
        run: go install github.com/zapstore/zsp/cmd/zsp@latest

      - name: Validate Zapstore metadata
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          zsp publish --check zapstore.yaml

      - name: Publish Android release to Zapstore
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_NSEC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$SIGN_WITH"
          export PATH="$(go env GOPATH)/bin:$PATH"
          zsp publish --quiet --skip-preview zapstore.yaml

  build-linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install npm dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libssl-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            flatpak flatpak-builder

      - name: Derive version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Write version to configs
        run: |
          VERSION="${{ env.VERSION }}"
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));
            cfg.version = process.env.VERSION;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(cfg, null, 2)+'\n');
          "
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Configure GPG for CI
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "GPG_TTY=/dev/null" >> $GITHUB_ENV
          echo "GPG_PASSPHRASE=" >> $GITHUB_ENV

      - name: Import signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | gpg --batch --no-tty --import
            # mark key as ultimately trusted so no trust prompts
            FPR=$(gpg --batch --no-tty --with-colons --fingerprint lostcause@3nostr.com | awk -F: '/^fpr:/{print $10; exit}')
            echo "$FPR:6:" | gpg --batch --no-tty --import-ownertrust
            echo "KEY_IMPORTED=true" >> $GITHUB_ENV
          fi

      - name: Build deb + AppImage
        run: npm run tauri build -- --bundles deb,appimage

      - name: Sign deb packages
        if: env.KEY_IMPORTED == 'true'
        run: |
          for deb in src-tauri/target/release/bundle/deb/*.deb; do
            printf '' | gpg --batch --no-tty --passphrase-fd 0 --detach-sign --armor "$deb"
          done

      - name: Sign AppImage
        if: env.KEY_IMPORTED == 'true'
        run: |
          for app in src-tauri/target/release/bundle/appimage/*.AppImage; do
            printf '' | gpg --batch --no-tty --passphrase-fd 0 --detach-sign --armor "$app"
          done

      - name: Set up Flathub remote
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install GNOME runtime
        run: |
          flatpak install --user -y --noninteractive \
            org.gnome.Platform//48 org.gnome.Sdk//48 2>&1 | tail -5 || true

      - name: Build Flatpak
        run: |
          flatpak-builder --force-clean --user \
            --repo=flatpak-repo \
            build-aux/flatpak/build-dir \
            build-aux/flatpak/com.writenostr.desktop.yml

      - name: Bundle Flatpak
        if: env.KEY_IMPORTED == 'true'
        run: |
          KEY_ID=$(gpg --batch --no-tty --with-colons --fingerprint lostcause@3nostr.com | awk -F: '/^fpr:/{print $10; exit}')
          flatpak build-bundle \
            --gpg-sign="$KEY_ID" \
            flatpak-repo \
            write-nostr.flatpak \
            com.writenostr.desktop

      - name: Bundle Flatpak (unsigned)
        if: env.KEY_IMPORTED != 'true'
        run: |
          flatpak build-bundle \
            flatpak-repo \
            write-nostr.flatpak \
            com.writenostr.desktop

      - name: Export public key
        if: env.KEY_IMPORTED == 'true'
        run: |
          gpg --batch --no-tty --armor --export lostcause@3nostr.com > build-aux/signing-key.pub

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: write-nostr-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.asc
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.asc
            write-nostr.flatpak
            build-aux/signing-key.pub

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.asc
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.asc
            write-nostr.flatpak
            build-aux/signing-key.pub
          generate_release_notes: true

      - name: Flathub PR
        env:
          FLATHUB_PAT: ${{ secrets.FLATHUB_PAT }}
        run: |
          if [ -z "$FLATHUB_PAT" ]; then
            echo "FLATHUB_PAT not set — skipping Flathub PR"
            exit 0
          fi

          REPO="flathub/com.writenostr.desktop"
          VERSION="${{ env.VERSION }}"
          BRANCH="update-v${VERSION}"

          git clone "https://x-access-token:${FLATHUB_PAT}@github.com/${REPO}.git" /tmp/flathub-repo
          cd /tmp/flathub-repo

          ARCHIVE_URL="https://github.com/imattau/write_nostr/archive/refs/tags/v${VERSION}.tar.gz"
          SHA256=$(curl -sL "$ARCHIVE_URL" | sha256sum | cut -d' ' -f1)

          node -e "
            const fs = require('fs');
            let yml = fs.readFileSync('com.writenostr.desktop.yml', 'utf8');
            yml = yml.replace(/version: '.*?'/, \"version: '$VERSION'\");
            yml = yml.replace(/url: .*write_nostr\\/archive.*/, \"url: $ARCHIVE_URL\");
            yml = yml.replace(/sha256: .*/, \"sha256: $SHA256\");
            fs.writeFileSync('com.writenostr.desktop.yml', yml);
          "

          git config user.name "write_nostr Release Bot"
          git config user.email "lostcause@3nostr.com"
          git checkout -b "$BRANCH"
          git add -A
          git diff --quiet && git diff --staged --quiet && echo "No changes — skipping PR" && exit 0
          git commit -m "Update to v${VERSION}"
          git push origin "$BRANCH"

          curl -s -X POST \
            -H "Authorization: token ${FLATHUB_PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${REPO}/pulls" \
            -d "{\"title\":\"Update to v${VERSION}\",\"head\":\"${BRANCH}\",\"base\":\"master\",\"body\":\"Automated update for [v${VERSION}](https://github.com/imattau/write_nostr/releases/tag/v${VERSION}).\"}"
